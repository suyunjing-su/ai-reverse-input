<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reserve Input Gateway</title><style>
:root{color-scheme:dark;--bg:#10151b;--panel:#19222c;--line:#2e3d4b;--text:#e7edf3;--muted:#9eacb9;--accent:#65b7ff;--danger:#ff7f8e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:28px 16px}h1,h2{margin:0 0 16px}h1{font-size:25px}.sub{color:var(--muted);margin:-8px 0 24px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin:14px 0}label{display:block;color:var(--muted);margin:10px 0 5px}input,textarea,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;background:#10171e;color:var(--text)}textarea{min-height:120px;resize:vertical}button{border:0;border-radius:6px;padding:9px 13px;background:var(--accent);color:#06111b;cursor:pointer;font-weight:600;margin:8px 5px 0 0}button.secondary{background:#334553;color:var(--text)}button.danger{background:var(--danger)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.stat{padding:13px;border:1px solid var(--line);border-radius:7px}.stat b{display:block;font-size:23px;color:var(--accent)}.rule{border-top:1px solid var(--line);padding:13px 0}.rule:first-child{border-top:0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.hidden{display:none}.error{color:var(--danger);margin-top:10px}.ok{color:#72dc9b;margin-top:10px}small{color:var(--muted)}@media(max-width:600px){main{padding:20px 12px}.row{display:block}}
</style></head><body><main>
<section id="login" class="card"><h1>Reserve Input Gateway</h1><p class="sub">管理面板登录</p><label>用户名</label><input id="user" autocomplete="username"><label>密码</label><input id="pass" type="password" autocomplete="current-password"><button onclick="login()">登录</button><p id="loginMsg" class="error"></p></section>
<div id="app" class="hidden"><h1>Reserve Input Gateway</h1><p class="sub">New API 前置透明代理 · <button class="secondary" onclick="logout()">退出</button></p><section class="grid" id="stats"></section>
<section class="card"><h2>模型专属提示词</h2><div class="row"><div><label>模型 ID（精确匹配）</label><input id="modelId"></div><div><label>提示词正文</label><textarea id="prompt"></textarea></div></div><button id="promptSave" onclick="addPrompt()">添加规则</button><button class="secondary" onclick="cancelPromptEdit()">取消编辑</button><div id="rules"></div></section>
<section class="card"><h2>Responses 自动重试</h2><label><input id="retryEnabled" type="checkbox" style="width:auto"> 启用重试（仅 POST /v1/responses）</label><div class="grid"><div><label>最大重试次数</label><input id="maxRetries" type="number" min="0" max="10"></div><div><label>基础间隔毫秒</label><input id="baseDelayMs" type="number" min="0"></div><div><label>最大退避毫秒</label><input id="maxDelayMs" type="number" min="0"></div><div><label>总时限毫秒</label><input id="totalTimeoutMs" type="number" min="100"></div><div><label>SSE 前置缓存字节</label><input id="preflightBytes" type="number" min="1024"></div><div><label>SSE 前置时限毫秒</label><input id="preflightMs" type="number" min="100"></div></div><label>HTTP 状态码规则（精确匹配错误状态码，例如 429、500；范围 400-599）</label><button class="secondary" onclick="addRetryRule('status')">添加状态码规则</button><div id="statusRules"></div><label>错误 code 规则（每行一个；精确匹配）</label><textarea id="codes"></textarea><button class="secondary" onclick="addRetryRule('code')">添加 code 规则</button><div id="codeRules"></div><label>错误 message 规则（每行一个；格式 substring-ci:文本 或 exact:文本）</label><textarea id="messages"></textarea><button class="secondary" onclick="addRetryRule('message')">添加 message 规则</button><div id="messageRules"></div><button onclick="saveRetry()">保存重试配置</button><p id="saveMsg"></p></section>
<section class="card"><h2>运行设置</h2><label>New API 上游地址</label><input id="upstreamUrl"><button onclick="saveSettings()">保存上游地址</button><p id="settings"></p></section><section class="card"><h2>诊断日志</h2><pre id="logs" style="white-space:pre-wrap;max-height:280px;overflow:auto;color:var(--muted)"></pre></section></div></main><script>
const $=id=>document.getElementById(id);let state;
async function api(path,opt={}){const r=await fetch(path,{headers:{'content-type':'application/json',...(opt.headers||{})},...opt});if(r.status===401){$('login').classList.remove('hidden');$('app').classList.add('hidden');throw Error('请先登录')}const d=await r.json();if(!r.ok)throw Error(d.error?.message||'请求失败');return d}
async function login(){try{await api('/admin/api/login',{method:'POST',body:JSON.stringify({username:$('user').value,password:$('pass').value})});$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){$('loginMsg').textContent=e.message}}
async function logout(){await api('/admin/api/logout',{method:'POST'});location.reload()}
async function load(){try{state=await api('/admin/api/state');render()}catch(e){$('loginMsg').textContent=e.message}}
function render(){const m=state.metrics||{};$('stats').innerHTML=[['请求量',m.requests],['提示词命中',m.promptHits],['重试次数',m.retries],['重试成功',m.retrySuccesses],['重试耗尽',m.retryExhausted]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${x[1]||0}</b></div>`).join('');$('rules').innerHTML=state.promptRules.map(r=>`<div class="rule"><div class="row"><strong>${esc(r.modelId)}</strong><small>命中 ${r.hits||0} 次 · ${r.enabled?'启用':'停用'} · ${r.promptLength} 字符</small><button class="secondary" onclick="editPrompt('${r.id}')">编辑</button><button class="secondary" onclick="togglePrompt('${r.id}',${!r.enabled})">${r.enabled?'停用':'启用'}</button><button class="danger" onclick="removePrompt('${r.id}')">删除</button></div></div>`).join('')||'<small>暂无规则</small>';const r=state.retry;$('retryEnabled').checked=r.enabled;$('maxRetries').value=r.maxRetries;$('baseDelayMs').value=r.baseDelayMs;$('maxDelayMs').value=r.maxDelayMs;$('totalTimeoutMs').value=r.totalTimeoutMs;$('preflightBytes').value=r.preflightBytes;$('preflightMs').value=r.preflightMs;$('codes').value=(r.codeRules||[]).filter(x=>x.enabled).map(x=>x.value).join('\n');$('messages').value=(r.messageRules||[]).filter(x=>x.enabled).map(x=>(x.mode==='substring-ci'?'substring-ci:':'exact:')+x.value).join('\n');$('upstreamUrl').value=state.upstreamUrl;renderRetryRuleControls();$('settings').textContent=`修改立即生效 · 管理会话重启后失效`;$('logs').textContent=(state.logs||[]).map(x=>`${x.at} ${x.level} ${x.message} ${JSON.stringify(x)}`).join('\n')||'暂无日志'}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let editingPromptId=null;async function addPrompt(){try{const payload={modelId:$('modelId').value.trim(),prompt:$('prompt').value};await api(editingPromptId?'/admin/api/prompts/'+editingPromptId:'/admin/api/prompts',{method:editingPromptId?'PUT':'POST',body:JSON.stringify(payload)});cancelPromptEdit();await load()}catch(e){alert(e.message)}}
function editPrompt(id){const rule=state.promptRules.find(x=>x.id===id);if(!rule)return;editingPromptId=id;$('modelId').value=rule.modelId;$('prompt').value=rule.prompt||'';$('promptSave').textContent='保存修改'}function cancelPromptEdit(){editingPromptId=null;$('modelId').value='';$('prompt').value='';if($('promptSave'))$('promptSave').textContent='添加规则'}
async function togglePrompt(id,enabled){await api('/admin/api/prompts/'+id,{method:'PUT',body:JSON.stringify({enabled})});await load()}async function removePrompt(id){if(confirm('删除此规则？')){await api('/admin/api/prompts/'+id,{method:'DELETE'});await load()}}
function renderRetryRuleControls(){const render=(kind,id)=>{const rules=state.retry[id]||[];return rules.map(r=>`<div class="rule"><div class="row"><span>${esc(kind==='status'?r.status:r.value)}</span><small>${kind==='status'?'HTTP 状态码':r.mode} · ${r.enabled?'启用':'停用'}</small><button class="secondary" onclick="editRetryRule('${kind}','${r.id}')">编辑</button><button class="secondary" onclick="toggleRetryRule('${kind}','${r.id}',${!r.enabled})">${r.enabled?'停用':'启用'}</button><button class="danger" onclick="removeRetryRule('${kind}','${r.id}')">删除</button></div></div>`).join('')||'<small>暂无规则</small>'};$('statusRules').innerHTML=render('status','statusRules');$('codeRules').innerHTML=render('code','codeRules');$('messageRules').innerHTML=render('message','messageRules')}
async function addRetryRule(kind){const value=prompt(kind==='status'?'HTTP 状态码（400-599）':'规则内容');if(!value)return;let payload;if(kind==='status'){const status=Number(value);if(!Number.isInteger(status)||status<400||status>599){alert('状态码必须是 400-599 的错误状态码');return}payload={status,enabled:true}}else{const mode=kind==='message'&&confirm('使用忽略大小写的子串匹配？')?'substring-ci':'exact';payload={value,mode,enabled:true}}state=await api('/admin/api/retry-rules/'+kind,{method:'POST',body:JSON.stringify(payload)});render()}async function editRetryRule(kind,id){const rules=kind==='status'?state.retry.statusRules:kind==='code'?state.retry.codeRules:state.retry.messageRules;const rule=rules.find(x=>x.id===id);if(!rule)return;let payload;if(kind==='status'){const value=prompt('HTTP 状态码（400-599）',String(rule.status));if(value===null)return;const status=Number(value);if(!Number.isInteger(status)||status<400||status>599){alert('状态码必须是 400-599 的错误状态码');return}payload={status}}else{const value=prompt('规则内容',rule.value);if(value===null)return;const mode=kind==='message'&&confirm('使用忽略大小写的子串匹配？')?'substring-ci':'exact';payload={value,mode}}state=await api('/admin/api/retry-rules/'+kind+'/'+id,{method:'PUT',body:JSON.stringify(payload)});render()}async function toggleRetryRule(kind,id,enabled){state=await api('/admin/api/retry-rules/'+kind+'/'+id,{method:'PUT',body:JSON.stringify({enabled})});render()}async function removeRetryRule(kind,id){if(!confirm('删除此规则？'))return;state=await api('/admin/api/retry-rules/'+kind+'/'+id,{method:'DELETE'});render()}
async function saveSettings(){try{state=await api('/admin/api/settings',{method:'PUT',body:JSON.stringify({upstreamUrl:$('upstreamUrl').value.trim()})});render()}catch(e){alert(e.message)}}
async function saveRetry(){const lines=s=>s.split('\n').map(x=>x.trim()).filter(Boolean);const codeRules=lines($('codes').value).map(value=>({value,mode:'exact',enabled:true}));const messageRules=lines($('messages').value).map(x=>{const i=x.indexOf(':');return {value:i<0?x:x.slice(i+1),mode:i>=0&&x.slice(0,i)==='substring-ci'?'substring-ci':'exact',enabled:true}});const r={enabled:$('retryEnabled').checked,codeRules,messageRules,maxRetries:+$('maxRetries').value,baseDelayMs:+$('baseDelayMs').value,maxDelayMs:+$('maxDelayMs').value,totalTimeoutMs:+$('totalTimeoutMs').value,preflightBytes:+$('preflightBytes').value,preflightMs:+$('preflightMs').value,exponentialBackoff:true};try{state=await api('/admin/api/retry',{method:'PUT',body:JSON.stringify(r)});$('saveMsg').className='ok';$('saveMsg').textContent='已保存并立即生效';render()}catch(e){$('saveMsg').className='error';$('saveMsg').textContent=e.message}}
api('/admin/api/state').then(d=>{$('login').classList.add('hidden');$('app').classList.remove('hidden');state=d;render()}).catch(()=>{});
</script></body></html>
